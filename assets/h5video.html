<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,minimal-ui,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="format-detection" content="telephone=no"/>
    <title>一起玩</title>
    <script src="js/autosize.js"></script>
    <link rel="stylesheet" href="css/style.css"/>
    <style>
    	html,body{background: #000;}
    	.videoBox,.videoBox video{position: absolute;top:0;left:0;width:100%;height:100%;background:#000000;}
    </style>
</head>
<body>
<div class="videoBox">
    <!--<video id="video01" autoplay poster="./images/videoBg.jpg">-->
    <video id="video01" autoplay>
        <!--<source src="http://static-img.abab618.com/1552376063624536.mp4" type="video/mp4">-->
        <source src="" type="video/mp4">
    </video>
    </video>
</div>
    <script>
        function GetQueryString(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)","i");
            var r = window.location.search.substr(1).match(reg);
            if (r!=null) return (r[2]); return "";
        }

        function onPageFinished() {
            console.log("page -- onPageFinished");

            var url = GetQueryString('videoUrl');
            var video01 = document.getElementById("video01");
            video01.setAttribute("src", url);
            video01.play();
        }
    </script>
    <script>
        function onPagePauseAndPlay() {
            console.log("page -- onPageFinished");
            var video01 = document.getElementById("video01");
            if(video01.paused) {
                video01.play();
            } else {
                video01.pause();
            }
        }
    </script>
    <script>
        function onPagePause() {
            console.log("page -- onPageFinished");
            var video01 = document.getElementById("video01");
            video01.pause();
        }
    </script>
    <script>
        window.onload = function(){
            var md = document.getElementsByTagName("video")[0];
            md.addEventListener('play',function(){
                <!--alert("开始");-->
            })
            md.addEventListener("ended",function(){
                <!--alert("结束");-->
                window.yqw.videoEndFunction();
            })
        }
    </script>
</body>
</html>
